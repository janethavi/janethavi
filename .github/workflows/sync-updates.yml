# Keeps the Life Updates page current without any third-party script.
#
# Runs `npm run sync:updates` daily, and commits the result only if something
# changed. That push is what triggers the Cloudflare Pages rebuild, so a new
# tweet is live within a day of being posted.
name: Sync life updates

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily (~07:30 in Sri Lanka)
  workflow_dispatch: # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run sync:updates

      - name: Commit new posts
        run: |
          if [ -z "$(git status --porcelain src/data/x-posts.json src/assets/updates)" ]; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/x-posts.json src/assets/updates
          git commit -m "chore(updates): sync life updates from X"
          git push
